name: Radar Automático — Repertórios Discursiva PRF

on:
  schedule:
    # Roda todos os dias às 08:00 (horário de Brasília / 11:00 UTC)
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radar-discursiva-prf
  cancel-in-progress: true

jobs:
  radar-repertorios:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Executar Radar Oficial (Agência Brasil, Câmara e Senado -> Fila Supabase)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RADAR_LOOKBACK_DAYS: '3'
        run: npm run radar:discursiva
