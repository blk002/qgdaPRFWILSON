<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>QG da PRF — Rastreador Caveira</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: 'Saira', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #08080a;
      color: #f4f4f5;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .logo-badge {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: #181920;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.5);
    }
    .title h1 {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #fff;
    }
    .title p {
      font-size: 10px;
      color: #a1a1aa;
      font-weight: 700;
      text-transform: uppercase;
    }
    .stats-card {
      background: #121216;
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      text-align: center;
      margin-top: 8px;
    }
    .stat-item {
      background: #18181e;
      padding: 8px 4px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .stat-label {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      color: #a1a1aa;
      display: block;
    }
    .stat-value {
      font-size: 16px;
      font-weight: 900;
      margin-top: 2px;
    }
    .stat-value.green { color: #10b981; }
    .stat-value.red { color: #ef4444; }
    .stat-value.gold { color: #fbbf24; }
    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: none;
      font-weight: 800;
      font-size: 11px;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
      margin-bottom: 8px;
    }
    .btn-primary {
      background: #2563eb;
      color: #fff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
    .btn-primary:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: #16161b;
      color: #d4d4d8;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .btn-secondary:hover {
      background: #202027;
      color: #fff;
    }
    .footer-note {
      font-size: 9px;
      color: #71717a;
      text-align: center;
      margin-top: 6px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-badge">💀</div>
    <div class="title">
      <h1>QG da PRF • Caveira <span id="ext-version" style="font-size:10px;color:#a1a1aa;opacity:0.9;">v1.0.4</span></h1>
      <p>Rastreador de Questões</p>
    </div>
  </div>

  <div class="stats-card">
    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase;">
      <span>Sessão Atual</span>
      <span id="txt-total-saved">0 no histórico</span>
    </div>

    <div class="stats-grid">
      <div class="stat-item">
        <span class="stat-label">Certas</span>
        <span class="stat-value green" id="stat-hits">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Erradas</span>
        <span class="stat-value red" id="stat-errors">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Acerto</span>
        <span class="stat-value gold" id="stat-net">0%</span>
      </div>
    </div>
  </div>

  <button class="btn btn-primary" id="btn-open-qg">
    <span>Abrir Raio-X no QG</span>
    <span>🎯</span>
  </button>

  <button class="btn btn-secondary" id="btn-copy-json">
    <span>Copiar Questões (JSON)</span>
    <span>📋</span>
  </button>

  <button class="btn btn-secondary" id="btn-reset-session" style="color: #f87171;">
    <span>Zerar Sessão</span>
    <span>🔄</span>
  </button>

  <p class="footer-note">Ativo automaticamente ao navegar no Projeto Caveira.</p>

  <script src="popup.js"></script>
</body>
</html>
